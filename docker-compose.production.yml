services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
      # The server is a 2 GB RAM VPS; uncapped, SQL Server would grab most of
      # it (~80% of system memory by default). Remove this cap if the server is
      # ever rescaled to 4 GB+ RAM.
      MSSQL_MEMORY_LIMIT_MB: "1024"
    volumes:
      - sqldata:/var/opt/mssql
    # No host port mapping — the tunnel is outbound-only and nothing outside the
    # compose network needs to reach SQL Server directly.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Loopback-only — reachable from the server itself (e.g. `curl localhost:8080`,
    # SSH tunnel) but not exposed to the internet. Public access goes through the
    # Cloudflare Tunnel -> ui's nginx reverse proxy instead.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Real production mode: no dev seed, no Swagger (both are gated on
      # IsDevelopment() in Program.cs) — this is the first real production deploy.
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=RentalPlatformDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: "RentalPlatform"
      Jwt__Audience: "RentalPlatform.Api"
      FileStorage__ListingsImagesPath: "uploads/listings"
      FileStorage__ChatAttachmentsPath: "uploads/chat"
      # Production starts from an empty database (no dev seed) — without these, there
      # would be no admin account at all. Read once on startup by AdminBootstrapRunner:
      # idempotent, and a no-op if the account already exists. See DEPLOY-PRODUCTION.md.
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD}
      # Initial public catalogue (DemoContentBootstrapRunner): the showcase owner accounts
      # plus the curated Approved listings. There is more than one owner, and that follows
      # from the home-point model (ADR-024): a listing's location IS its owner's home point,
      # so a single showcase owner would put the entire public catalogue on one pin and leave
      # 11 of 12 district filters empty. The runner therefore creates a BASE account (the
      # address below) plus one account per Yerevan district the catalogue reaches — 12
      # districts today, 13 accounts in total — and spreads the listings across them.
      #
      # Only the base account is a login. BOOTSTRAP_DEMO_OWNER_PASSWORD applies to it alone;
      # the per-district accounts get a cryptographically random password that is hashed and
      # immediately discarded — never logged, never stored in plaintext, never reported — so
      # there is no credential to leak and none to look up. ADR-005's published-password
      # trade-off stays at that ONE account and is deliberately NOT widened to thirteen.
      #
      # Idempotent and additive-only — safe to leave enabled. See DEPLOY-PRODUCTION.md.
      #
      # The `:-false` default is load-bearing, not cosmetic. Compose interpolates an unset
      # or empty .env var to an empty string and STILL sets the key ("" is not "absent"),
      # and the app reads this one via configuration.GetValue<bool>(), which THROWS
      # InvalidOperationException on "" instead of defaulting to false — that is a startup
      # crashloop, and since ui/cloudflared gate on api's `service_healthy`, it would take
      # the whole site down. `:-false` substitutes when the var is unset OR empty, which is
      # exactly the state .env.production.example ships. Must be exactly true/false —
      # other truthy spellings ("yes", "1") throw the same way.
      Bootstrap__DemoContentEnabled: ${BOOTSTRAP_DEMO_CONTENT_ENABLED:-false}
      # Plain strings, so empty is harmless: the runner no-ops when either is blank
      # (same contract as the admin pair above).
      Bootstrap__DemoOwnerEmail: ${BOOTSTRAP_DEMO_OWNER_EMAIL}
      Bootstrap__DemoOwnerPassword: ${BOOTSTRAP_DEMO_OWNER_PASSWORD}
      # Real client IP for every per-IP rate limit (ADR-027). Without this, RemoteIpAddress is
      # the ui/nginx container for EVERY public request, i.e. one global bucket for all users.
      # nginx (Rental-Ui/nginx.conf) overwrites X-Forwarded-For with Cloudflare's
      # CF-Connecting-IP; the API honours that header only when the TCP peer is inside the
      # stack network pinned at the bottom of this file. The subnet is written ONCE, here, as
      # the YAML anchor &stack_subnet; `networks.default` below reuses it via *stack_subnet, so
      # the trusted range and the real range cannot drift apart.
      # Literal values, deliberately NOT ${...} from .env: no empty value can ever reach the
      # parser (M-016), and the trust boundary is reviewable in this one file.
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownNetworks__0: &stack_subnet "172.18.0.0/16"
      ForwardedHeaders__ForwardLimit: "1"
      # Transactional email: verification links only (ADR-028, ADR-029). Every key has a
      # `:-default`, so an unset OR empty .env value never reaches the parser as "" (M-016);
      # the app parses all of them tolerantly anyway and never throws on a bad value.
      #
      # Production gate (ADR-028 section 9): unless Provider=Resend AND the API key is set AND
      # PublicBaseUrl is https, the api still starts and stays healthy, but logs ONE Critical
      # line at startup ("Email verification is NOT operational in Production: ...") and
      # POST /api/auth/register + /api/auth/resend-verification answer 503
      # auth.registration_unavailable. The `Log` default below therefore fails CLOSED:
      # forgetting EMAIL_PROVIDER=Resend disables sign-up, it never creates unverifiable users.
      # smoke.sh (check email-gate) fails when that line is in the current api process's log.
      Email__Provider: ${EMAIL_PROVIDER:-Log}
      # Quoted: the default contains spaces and angle brackets. Must be an address on the
      # Resend-verified domain (dorent.am), otherwise Resend rejects every send.
      Email__From: "${EMAIL_FROM:-DoRent <no-reply@dorent.am>}"
      # SECRET. Lives only in the server's .env (mode 600), put there by Tigran.
      Email__Resend__ApiKey: ${EMAIL_RESEND_API_KEY:-}
      # Global cap on emails actually SENT (not requests), sized to the Resend free tier.
      # When exhausted: register still 201, resend still 202, nothing is sent, Critical log.
      Email__SendBudget__Limit: ${EMAIL_SEND_BUDGET_LIMIT:-100}
      Email__SendBudget__WindowHours: ${EMAIL_SEND_BUDGET_WINDOW_HOURS:-24}
      # Base of the verification link ({base}/auth/verify-email#token=...). Taken only from
      # config, never from the request Host. Must be https in Production (gate above).
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-https://dorent.am}
    volumes:
      - uploads:/app/wwwroot/uploads/listings
      - chat-uploads:/app/wwwroot/uploads/chat
    healthcheck:
      # aspnet:8.0 (Debian bookworm-slim base) ships neither curl nor wget; bash IS
      # present, so we speak raw HTTP over bash's /dev/tcp pseudo-device against the
      # anonymous, DB-free /health endpoint instead of pulling in a tool.
      # Generous start_period: EF Core migrations + admin bootstrap + cold JIT start,
      # contending with SQL Server for CPU/RAM on a 1 vCPU / 2 GB box.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && head -n 1 <&3 | grep -q 200'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ui:
    build: ../Rental-Ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Loopback-only, same rationale as api's port mapping above.
    ports:
      - "127.0.0.1:4200:80"
    healthcheck:
      # nginx:alpine (busybox) has wget but no curl. Must target 127.0.0.1, not
      # localhost: busybox wget resolves "localhost" to IPv6 ::1 first, but nginx.conf
      # only has "listen 80;" (IPv4) with no "listen [::]:80" — so "localhost" here
      # would connection-refuse forever and never report healthy.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqldata:
  uploads:
  chat-uploads:

# The stack network (`rental-api_default`), with its subnet PINNED (ADR-027): the api trusts
# X-Forwarded-For only from peers inside this range (ForwardedHeaders__KnownNetworks__0 above,
# the same &stack_subnet anchor), so the range must not depend on what Docker happens to hand
# out on the next recreate.
# 172.18.0.0/16 is exactly what Docker had already assigned to this network in production
# (verified 2026-10-08), so pinning it changes nothing on the wire:
#   - if the live network was created by a Compose that labels networks with a config hash,
#     `up -d` recreates it (stop all four containers, recreate network, start in
#     healthcheck order) — same subnet, volumes untouched;
#   - if it carries no such label, Compose silently keeps the existing network — which is
#     ALREADY 172.18.0.0/16, so the trusted range is still right.
# A different range would be wrong in that second case without any error (silent fallback to
# one global rate-limit bucket). Never pin a range without checking the live subnet after
# `up -d`: docker network inspect rental-api_default --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
networks:
  default:
    ipam:
      config:
        - subnet: *stack_subnet
