services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RentalPlatform_SA#1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RentalPlatform_SA#1' -Q 'SELECT 1' -C -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      secrets:
        - sixlabors_lic
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=RentalPlatformDb;User Id=sa;Password=RentalPlatform_SA#1;TrustServerCertificate=True;"
      Jwt__SecretKey: "docker-compose-dev-secret-key-change-in-production"
      Jwt__Issuer: "RentalPlatform"
      Jwt__Audience: "RentalPlatform.Api"
      FileStorage__ListingsImagesPath: "uploads/listings"
      FileStorage__ChatAttachmentsPath: "uploads/chat"
      FileStorage__AvatarsPath: "uploads/avatars"
      # Public OAuth client id (not a secret); empty audiences = Google unavailable (ADR-030 §7).
      ExternalAuth__Google__ValidAudiences__0: "${GOOGLE_CLIENT_ID:-6707214612-40dcffqfdopo4h12l9bg69h9gqp7oupt.apps.googleusercontent.com}"
    volumes:
      - uploads:/app/wwwroot/uploads/listings
      - chat-uploads:/app/wwwroot/uploads/chat
      - avatar-uploads:/app/wwwroot/uploads/avatars

  ui:
    build: ../Rental-Ui
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  sqldata:
  uploads:
  chat-uploads:
  # Explicit name (ADR-070): independent of the compose project name, so the backup script and the restore
  # rehearsal can refer to it by this exact name. The two older volumes keep their implicit names.
  avatar-uploads:
    name: rental-api_avatar-uploads

# ADR-070: the ImageSharp licence file, passed to `docker build` as a BuildKit secret (never ARG/ENV, never in
# an image layer). Point SIXLABORS_LIC_FILE at the file OUTSIDE any repo (the build targets also glob
# **/sixlabors.lic, so a stray copy inside a repo would be picked up and could be committed).
secrets:
  sixlabors_lic:
    file: ${SIXLABORS_LIC_FILE}
